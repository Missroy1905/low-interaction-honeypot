<!DOCTYPE html><html><head><meta charset='utf-8'><title>Honeypot Dashboard</title><script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1'></script><style>body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:20px}.cards{display:flex;gap:16px;margin-bottom:20px}.card{background:#222;padding:16px;border-radius:8px;flex:1;text-align:center}.card h2{margin:0;font-size:32px;color:#4fc3f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{background:#222;padding:16px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px 8px;text-align:left;border-bottom:1px solid #333}</style></head><body><h1>Honeypot Attack Dashboard</h1><div class='cards'><div class='card'><h2 id='total'>0</h2>Total events</div><div class='card'><h2 id='logins'>0</h2>Login attempts</div><div class='card'><h2 id='ips'>0</h2>Unique attacker IPs</div><div class='card'><h2 id='cmds'>0</h2>Commands typed</div></div><div class='grid'><div class='box'><h3>Events over time (per minute)</h3><canvas id='c_time'></canvas></div><div class='box'><h3>Events by service</h3><canvas id='c_svc'></canvas></div><div class='box'><h3>Top usernames tried</h3><canvas id='c_user'></canvas></div><div class='box'><h3>Top passwords tried</h3><canvas id='c_pass'></canvas></div><div class='box'><h3>Top attacker IPs</h3><canvas id='c_ip'></canvas></div><div class='box'><h3>Recent commands</h3><table id='t_cmd'></table></div></div><script>const charts={};function draw(id,type,rows,label){const labels=rows.map(r=>r.label);const data=rows.map(r=>r.n);if(charts[id]){charts[id].data.labels=labels;charts[id].data.datasets[0].data=data;charts[id].update();return;}charts[id]=new Chart(document.getElementById(id),{type:type,data:{labels:labels,datasets:[{label:label,data:data}]}});}function fillTable(rows){const t=document.getElementById('t_cmd');t.textContent='';const head=t.insertRow();['Time','IP','Command'].forEach(h=>{const th=document.createElement('th');th.textContent=h;head.appendChild(th);});rows.forEach(r=>{const tr=t.insertRow();[r.timestamp.replace('T',' ').slice(0,19),r.src_ip,r.command].forEach(v=>{tr.insertCell().textContent=v;});});}async function refresh(){const s=await(await fetch('/api/stats')).json();document.getElementById('total').textContent=s.total;document.getElementById('logins').textContent=s.logins;document.getElementById('ips').textContent=s.unique_ips;document.getElementById('cmds').textContent=s.commands;draw('c_time','line',s.over_time,'Events');draw('c_svc','doughnut',s.by_service,'Events');draw('c_user','bar',s.usernames,'Attempts');draw('c_pass','bar',s.passwords,'Attempts');draw('c_ip','bar',s.ips,'Events');fillTable(s.recent_commands);}refresh();setInterval(refresh,5000);</script></body></html>
